; ============================================================================
; Delphi IDE Remote MCP Server - configuration template
; ============================================================================
; Copy this file as "settings.ini" NEXT TO DelphiLspMcp.exe and edit.
; Every key is optional. Where noted, an environment variable takes
; precedence over the ini. Save the file WITHOUT a BOM: Windows does not see
; a section header with a BOM in front, so a BOM right before [Server] would
; lose its Port and BindIP - the server refuses to start and says so.
;
; ONE PRINCIPLE RULES THIS FILE (v0.98): NOTHING IS GLOBAL. Every permission,
; every whitelist, every capability belongs to ONE workspace, and a workspace
; has EXACTLY what its section declares - an absent switch is OFF, an absent
; list is EMPTY (nothing allowed). No inheritance, no hidden defaults.
;
;   [Workspace.<name>]   one section per token: its secret, its jail, its
;                        capabilities, its reach. The secret decides the
;                        jail, never the self-declared agent name - and it
;                        is the ONLY kind of section: a workspace or nothing.
;                        A local stdio process without a token may only
;                        READ; HTTP without a token is 401, always.
;
; MIGRATING from v0.97 or earlier: the [Security] section IS GONE. If the
; server finds one it IGNORES it entirely - no warning, no compatibility.
;   - AuthToken=/ReadOnlyToken= stopped authenticating in v0.91 already
;     (workspace or nothing): put them in a [Workspace.<name>] as Token=.
;   - Every other key (AllowTests, AllowRemoteRun,
;     AllowBuildScripts, LibraryZone, AgentConfinement, SharedFolders,
;     GitRemotes, RemoteHosts, RemoteRunProjects) moves into each
;     [Workspace.<name>] that needs it. Same names, same values: what was
;     one global decision is now one decision PER workspace. There is NO
;     generic [Workspace] section either, and AnonymousReadOnly is gone
;     with it: tokenless HTTP answers 401, always.
;   - The global [Vault] and [Adb] sections are gone the same way: their
;     keys are now PER WORKSPACE as VaultPath=, VaultReadOnly= and
;     AdbAllowedDevices= (and "no AdbAllowedDevices" now means NO devices,
;     not unrestricted - the last fail-open is gone).
;
; Defaults are safe: no credentials = localhost-only bind; execution OFF
; everywhere; explicit URLs refused; nothing remotely executable. You opt IN
; to everything, workspace by workspace.
;
; ============================================================================
; IF YOU RUN THIS AS A WINDOWS SERVICE, READ THIS FIRST
; ============================================================================
; The service MUST log on as the user who installed and uses RAD Studio.
; Not LocalSystem (which is what -install leaves you with), and not a freshly
; created administrator account either.
;
; RAD Studio keeps its configuration under HKEY_CURRENT_USER: the Library
; Search Path, the registered design packages, the platform SDKs, the
; PAServer profiles, the $(BDS) macro table. That is per user, by
; Embarcadero's design, and there is no way around it - even if this server
; read someone else's hive, the msbuild and DelphiLSP.exe processes it
; spawns are its children and would read their own.
;
; The failure is QUIET, which is why this sits here and not in a footnote.
; Measured on one machine, same binary, changing only the account:
;
;     logs on as                 library roots   registered packages
;     LocalSystem                       1                 0
;     a brand-new admin account         2                 0
;     the IDE's own user               11                all of them
;
; In all three the server starts, answers, and reports the right Delphi
; version - the installation itself lives in HKEY_LOCAL_MACHINE, so it is
; always found. It breaks the first time a project uses an installed
; component, with "F2613 unit not found" and nothing pointing at the cause.
;
; Set it in services.msc -> the service -> Log On -> This account. Do it
; there rather than with sc config: that dialog also grants the account the
; "Log on as a service" right, and the password never travels on a command
; line. The SCM stores it, so changing that Windows password later stops the
; service from starting until you re-enter it.
;
; Full detail, including how to let an agent stop and start the service
; without elevation, is in the README.

; ----------------------------------------------------------------------------
[Server]
; ----------------------------------------------------------------------------
; HTTP listen port for --http mode and the tray app (-gui). Default: 3000.
; A port on the command line (DelphiLspMcp --http 3900) overrides this.
Port=3000

; Listen on ONE interface only (e.g. your LAN/VPN address). Empty = all
; interfaces - EXCEPT when no credential of any kind is configured, in which
; case the server binds to 127.0.0.1 on its own (fail safe).
; Env var DELPHI_MCP_BIND_IP takes precedence.
; BindIP=192.168.1.50

; How long an HTTP session may sit IDLE before it expires, in minutes. A
; session is born at initialize and touched by every request that carries
; its Mcp-Session-Id; past this, the next request on it answers 404 with
; the reason and the client re-initializes (the streamable-HTTP contract).
; Default 720 (12 h); 0 = never expire. Decimals are accepted. Generous on
; purpose: every re-initialize costs an agent a whole tools/list. Env var
; DELPHI_MCP_SESSION_TIMEOUT_MINUTES takes precedence. Plumbing, not a
; permission: that is why it lives under [Server].
; SessionTimeoutMinutes=720

; EngineIdleMinutes: an LSP engine (DelphiLSP.exe) nobody has used for this
; many minutes is stopped - each one at rest keeps about 125 MB - and the
; next request of its project starts another (its first answer came 2.1 s
; later on a small project). The same time closes a document an engine has open and
; nobody asks about. Default 30; 0 = engines are never stopped for lack of
; use. Decimals are accepted. Env var DELPHI_MCP_ENGINE_IDLE_MINUTES takes
; precedence.
; EngineIdleMinutes=30

; DelphiVersion: the ONE RAD Studio this server uses - the BDS version number
; (37.0 = RAD Studio 13, 23.0 = 12 Athens, 22.0 = 11 Alexandria), and it comes
; from here and nowhere else. ONE SERVER, ONE DELPHI: the build
; (rsvars/msbuild), the DelphiLSP engine, the components, the designer
; tables, profiles, SDKs, paclient, adb and the library zone all come from
; that installation, and no tool looks at another. Without its Delphi the
; server DOES NOT START: a version that is not installed (or ships no
; DelphiLSP) stops it, with the reason and the keys that would work here in
; its log - it never falls back to another one. Absent = the newest install
; that ships DelphiLSP, and the server WRITES it here at its first start (one
; new line under [Server]; nothing else in this file changes): from then on
; the key rules, and installing a newer RAD Studio does not switch the
; server by itself. At startup the log lists every installation on this
; machine with the exact line to copy here, and marks the one in use.
; Several Delphi versions on one machine = several servers, each one in its
; own folder with its own settings.ini, Port and roots (never the same roots:
; two processes would write the same files blind to each other), run however
; you like. Until 1.13 each workspace chose its own: a [Workspace.<name>]
; DelphiVersion= is no longer read, and the startup log says so.
; DelphiVersion=37.0

; DelphiUpdate (optional): which update of that RAD Studio this server runs,
; as its operator declares it - 13.1, 13.2, and tomorrow 14.1. 13.1 and 13.2
; are both 37.0 (same folders, same registry key, one replaces the other)
; and today the server works the same with both: nothing reads this key to
; decide anything yet. It is there for what a given update may need one day.
; It is declared, never deduced: the startup log shows the update each
; installer recorded ("Delphi 13 and C++Builder 13 Update 1") as a hint. A
; value that is not number.number is ignored, and the log says so. Absent =
; none declared.
; DelphiUpdate=13.1

; ----------------------------------------------------------------------------
; [Workspace.<name>]  - the ONLY kind of workspace (v0.98: nothing generic)
; ----------------------------------------------------------------------------
; A WORKSPACE OR NOTHING. A client either presents the Token= of one of these
; sections (HTTP Bearer, or DELPHI_MCP_TOKEN in the environment of a stdio
; process launched on this machine) and lives inside THAT declaration, or
; it gets nothing: HTTP answers 401, and a tokenless LOCAL stdio process
; may only LOOK - it reads everything, writes nothing.
;
; THE SECRET DECIDES THE JAIL, not the self-declared agent name: whoever
; presents a section's Token works read-write inside ITS Roots and nowhere
; else - other workspaces' roots are not even READABLE (hard boundary).
; A WORKSPACE HAS EXACTLY WHAT IT DECLARES: nothing is inherited, an absent
; switch is OFF, an absent list is EMPTY - including the reach lists
; (GitRemotes, RemoteHosts, RemoteRunProjects, AdbAllowedDevices) and the
; vault (VaultPath/VaultReadOnly). Workspaces may OVERLAP (each token's
; jail is the union of its OWN roots); Roots that fail to parse admit
; NOBODY; the credential key is Token= (AuthToken= is an accepted alias)
; and a tokenless or misspelled section is IGNORED with a startup warning.
;
; The DELPHI_MCP_* variables mirror these keys 1:1 for the LOCAL LAUNCH
; mode only (test batteries, a dev session): whoever starts the process may
; declare its jail (DELPHI_MCP_ROOTS) and switches in its environment.
; They never touch a named workspace.
;
; Every key below is documented once and goes INSIDE a [Workspace.<name>]:

; The jail. Semicolon-separated roots; quotes around a path with spaces are
; tolerated. They are BOTH discovery (delphi_projects) and a boundary: every
; disk-touching tool refuses paths outside them. Fail closed: if Roots has
; text but nothing parses, nothing is allowed.
; Declare a root by a path with its DRIVE LETTER (D:\...), also on a network
; share: an entry that is not one - a network path \\server\share\x, a
; device path - is not loaded, and the startup log says so. A whole drive
; (N:\) is a root like any other. A network letter the server process does
; not see (a Windows Service does not see the ones of the desktop) is
; connected by the server itself at startup, from the account's persistent
; mapping of that letter ("reconnect at sign-in"), and tried again in the
; background if the network was not there yet; the log says what happened.
; Roots=D:\Projects\MyWorkspace

; Folders INSIDE the jail that are READ but never written. Separated by
; ";". Relative = resolved against each root ("vendor" = the vendor folder
; of my project); an absolute one is a path with its drive letter. Absent =
; none, which is the behaviour there always was. An entry that is not
; loaded (not a path with a letter, or one that does not parse: a wildcard)
; CLOSES the workspace, and the startup log says so: left out and nothing
; more, what it names could be written.
;
; What it exists for: third-party code that lives INSIDE the project because
; that is where it has to be - a vendor/, a submodule, a reference clone
; with its own git. An agent reads it, compiles it and follows it with
; delphi_definition, but never touches it. Mind the case that motivated it:
; when the folder is ANOTHER git repository, a careless write does not even
; show in the main repository's "git status", so a whole session can go by
; without anyone noticing.
;
; It is not the jail, and the server says so differently: the jail is "you
; do not enter there", this is "you look there and do not touch".
;
; It opens NOTHING outside the roots: for an entry outside every root of
; the workspace and of its references (absolute, or relative with ..), its
; agents get nothing - neither reading nor protection - and since 1.9.1 the
; startup log says so. To let them read a folder outside their roots
; without writing it - our code, to learn from - the key is ReadOnlyRoots,
; below.
; ReadOnlyPaths=vendor;thirdparty\library-x

; REFERENCE projects: folders OUTSIDE Roots that this workspace may READ
; as if they were its own - read, search, symbols, definition, git
; query, fetch - and never write: no edit, no build (a build writes dcu
; and exe), no move, no temp files. Semicolon-separated, absolute, same
; syntax as Roots (a path with its drive letter; an entry that is not
; loaded closes the workspace, as in ReadOnlyPaths). The idea: an agent
; works in ITS roots and can also see
; other projects of the house to learn how things are done here. This is
; the key for "read our code, wherever it is, and touch nothing":
;   Roots=D:\Sandbox
;   ReadOnlyRoots=D:\Projects
; Deliberately separate from Roots - the write jail does not even see
; them - and it WINS over Roots: a folder in both lists, or a root that
; lies inside a ReadOnlyRoot, is read-only (what you are surest about is
; what you want read-only). delphi_projects lists them with readOnly:true.
; Absent = none.
; ReadOnlyRoots=D:\Projects\ReferenceERP;D:\Projects\Templates

; --- Execution opt-ins - all OFF: this is a compile server ------------------

; 1 = delphi_test command=run may BUILD and RUN a test project of the
; workspace here (console/DUnitX runner, sandboxed, timeout). The ONLY thing
; that executes on this server (delphi_run / AllowRun were retired on
; 2026-09-23: a left-over AllowRun=1 is ignored) - and without it an agent
; can write code but never learn whether it works. command=discover works
; regardless.
; AllowTests=1

; 1 = delphi_paserver command=remote-run may EXECUTE, on a PAServer target,
; the program THAT PROJECT deployed there - never anything else on that
; machine: the server derives the path itself, and the native launcher it
; sends checks the file's signature (ELF/PE) so only a NATIVE
; BINARY ever runs, no matter what else sits in the deploy folder.
; Running on the target is not running here (nothing runs here), and
; the operator of this server is not necessarily the owner of that machine.
; Needs RemoteRunProjects below too - both are declarations, and an empty
; list allows NOTHING.
; AllowRemoteRun=1

; 1 = delphi_build may compile a project whose .dproj declares custom MSBuild
; targets that RUN a program or write files (post-build steps, Authenticode
; signing). Default 0: a build is otherwise a compile, and a hostile .dproj
; would be arbitrary execution. A trusted project can sign on build without
; anything else being allowed to run.
; AllowBuildScripts=1

; --- Reach: where may THIS workspace's calls go -----------------------------

; Host NAMES delphi_git may reach when an agent writes an EXPLICIT url
; (clone/fetch/pull/push), comma-separated. Empty - the default - refuses
; every explicit URL. Measured reason: a fetch of http://127.0.0.1:3131/...
; made the SERVER open that connection (SSRF), and a push to an attacker URL
; walked the jail's contents out. The remotes YOU configured in a repository
; keep working by name (push origin main).
; GitRemotes=github.com,gitlab.example.com

; Host NAMES delphi_paserver may DIAL, comma-separated - whether the caller
; names one by hand (test-connection host=..., add-profile host=...) or
; goes through a connection PROFILE (test-connection name=, get-sdk,
; remote-run, delphi_desktop): since v0.98 having a profile in the IDE is
; NOT permission - the profile says HOW to connect, the workspace says
; WHETHER. Measured reason: without the list, test-connection was a port
; scanner run from inside this machine's network. '*' (or 0.0.0.0) = ANY
; host, an explicit operator declaration.
; RemoteHosts=192.168.1.81;192.168.1.177

; Project NAMES (or full .dproj paths) remote-run may execute on a target,
; semicolon-separated, matched without extension, case-insensitive.
; EMPTY = NOTHING may run remotely (since v0.98; it used to mean "any
; project of the roots", the one fail-open default this server had left).
; Declare what you enable - or declare EVERYTHING on purpose with all
; (or *): the wildcard is itself a declaration.
; delphi_desktop runs this server's own desktop node on the target: add
; McpDesktopNode to the list to let this workspace SEE and TYPE on a target's
; desktop - a permission of its own (without it: RUN-020).
; RemoteRunProjects=GalateaFMX;MyApp

; --- Zones and subdivision --------------------------------------------------

; 1 = reading tools may ALSO enter the
; read-only LIBRARY ZONE (RTL/VCL/FMX sources, installed components, GetIt
; catalog, SDKs) besides the jail - that is what lets an agent check an API
; in the real source instead of guessing. Readable, never writable.
; 0 = cut it: reads confined to the roots, exactly like writes.
; ABSENT means OFF, like every other absent switch: declare LibraryZone=1
; per workspace that deserves it. delphi_workspace lists the folders.
; LibraryZone=1

; 1 = each identified agent may WRITE only inside its own subfolder
; <root>\<clientInfo.name>\... (reading the whole tree stays open). This is
; COOPERATIVE subdivision inside one credential's jail - the name is
; self-declared; for a boundary the agent cannot cross, use a
; [Workspace.<name>] token instead.
; A caller with no identity (stdio / the operator) is never confined.
; AgentConfinement=1

; Subfolder names any agent may write even under AgentConfinement (a common
; drop area), comma-separated.
; SharedFolders=drop;shared

; --- The knowledge vault of THIS workspace (optional) -----------------------
; Persistent MEMORY for your agents: point VaultPath at a folder of Markdown
; notes (an Obsidian vault) and this workspace gets vault_read/vault_search -
; accumulated decisions, conventions and project context, not just source
; code. Per workspace like everything else (v0.98: the old global [Vault]
; section is gone): a workspace without VaultPath= has NO vault, and two
; workspaces may point at DIFFERENT vaults. The vault carries its own rules:
; the agent bootstraps with vault_read (no path). See docs/VAULT.md.
; A path with its drive letter, like every place: one that is not (a
; network path) is not loaded and closes the workspace.
; VaultPath=D:\Vaults\AI-Memory

; 1 (default) = read-only: vault_read/vault_search only. 0 = THIS workspace
; may also vault_append/create/patch (append, create and anchored replace -
; never wholesale rewrites or deletes - always backing up the original
; first). A read-only credential is refused regardless, per request.
; VaultReadOnly=1

; Devices delphi_adb may touch FROM THIS WORKSPACE: serials or IPs,
; semicolon-separated (an IP matches whatever port wifi debugging
; negotiates). Like every list in this file: absent or empty = NO devices
; (v0.98; the old global [Adb] AllowedDevices - and its "absent =
; unrestricted" - are gone).
; AdbAllowedDevices=192.168.1.163

; Three contrasting examples. A comment goes on its own line, never after a
; value: Windows keeps a trailing "; ..." as part of the value (Port=3000 ; x
; is not port 3000, and a token with its comment glued on matches nobody).
;
; The full-featured dev space: read-write inside its roots, a reviewer
; credential on the same roots, may read the RTL sources and run ITS test
; suites; Profile=coder hides the deploy trio for them.
; [Workspace.Galatea]
; Token=a-long-secret-for-this-space
; ReadOnlyToken=another-read-only-secret
; Roots=D:\SandBox-lsp\galatea;D:\SandBox-lsp\shared
; LibraryZone=1
; AllowTests=1
; Profile=coder
;
; A CI-style space: may execute, and ONLY to this machine for hand-named
; dials, and ONLY this project.
; [Workspace.Runner]
; Token=fourth-secret
; Roots=D:\SandBox-lsp\ci
; AllowTests=1
; AllowRemoteRun=1
; RemoteHosts=192.168.1.81
; RemoteRunProjects=MyApp
;
; A narrow, read-leaning space on a subfolder of Galatea: navigation tools
; only in the list (no LibraryZone, no execution, no reach: it declared none).
; [Workspace.Auditoria]
; Token=third-secret
; Roots=D:\SandBox-lsp\galatea\codigofuente\Forms
; Profile=reader

; ----------------------------------------------------------------------------
[Tools]
; ----------------------------------------------------------------------------
; SURFACE, not security: trims what tools/list ADVERTISES. Hidden tools stay
; callable - permissions are the credentials and the jail above. Why: a small
; model reading every schema (tens of thousands of tokens) drowns before
; working. delphi_help,
; delphi_messages and delphi_report are always listed. A [Workspace.<name>]
; Profile= overrides this global one for that token.
; Env var DELPHI_MCP_TOOLS_PROFILE takes precedence.
;   full   (default) every tool
;   coder  everything except the shipping trio (adb, paserver, package)
;   reader understand and navigate only: read/list/search/fetch, the LSP
;          eight, projects/installs/workspace, vault_read/vault_search
Profile=full

; Explicit allowlist (comma-separated tool names); overrides Profile.
; Env var DELPHI_MCP_TOOLS_ONLY takes precedence.
; Only=delphi_read,delphi_search,delphi_symbols

; ----------------------------------------------------------------------------
[Log]
; ----------------------------------------------------------------------------
; The server's log on disk, the same in every mode (service, terminal, tray),
; next to the exe under logs\: actual.log is the live tail (every half second),
; renamed to a dated block every LinesPerFile lines; the newest MaxFiles
; blocks are kept.
; LinesPerFile=2000
; MaxFiles=10
