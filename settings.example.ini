; DelphiLSP MCP Service - configuration template.
; Copy this file as "settings.ini" NEXT TO THE EXE (DelphiLspMcp.exe /
; DelphiLspMcpTray.exe) and edit. Every key is optional; environment
; variables (where noted) take precedence over the ini.

[Server]
; HTTP listen port for --http mode and the tray app. Default: 3000.
; A port on the command line (DelphiLspMcp --http 3900) overrides this.
Port=3000

[Security]
; Bearer token with FULL read-write access (Authorization: Bearer <token>).
; Env var DELPHI_MCP_TOKEN takes precedence. Empty = no auth: fine on
; localhost, do NOT expose to the network like that.
AuthToken=

; Optional second credential with READ-ONLY access: reading, searching,
; symbols, diagnostics, downloads and query git commands work; edit, create,
; build, run, package and git write commands are refused. For reviewer
; agents. Env var DELPHI_MCP_READONLY_TOKEN takes precedence.
ReadOnlyToken=

; 1 = requests WITHOUT a token get read-only access instead of 401.
AnonymousReadOnly=0

[Workspace]
; Semicolon-separated roots. They are BOTH discovery (delphi_projects) and a
; JAIL: with roots set, every disk-touching tool refuses paths outside them.
; Env var DELPHI_MCP_ROOTS takes precedence. Empty = unrestricted local mode.
Roots=
